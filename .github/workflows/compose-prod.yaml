name: Production Compose

on:
  pull_request:
    paths:
      - "docker-compose.prod.yml"
      - ".env.production.example"
      - "deploy/**"
      - ".github/workflows/compose-prod.yaml"
  # Called by deploy.yaml on main.
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every <placeholder> in the template becomes a dummy value, so a variable the Compose file
      # requires but the template lacks fails here. LOC_IMAGE_TAG is set by deploy.sh, not the template.
      - name: Validate with the template
        run: |
          sed 's/<[^>]*>/dummy/g' .env.production.example > "$RUNNER_TEMP/dummy.env"
          LOC_IMAGE_TAG=dummy docker compose -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/dummy.env" config --quiet

      - name: Check the deploy script
        run: shellcheck deploy/deploy.sh
