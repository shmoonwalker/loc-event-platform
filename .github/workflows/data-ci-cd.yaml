name: Data CI/CD

on:
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/data-ci-cd.yaml"
  # Called by deploy.yaml on main, which pushes the image.
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false

# Cancel superseded pull request runs; a run called by deploy.yaml gets its own group.
concurrency:
  group: data-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The data application has no tests yet; the image build compiles it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./data
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/loc-data:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=data
          cache-to: type=gha,scope=data,mode=max
