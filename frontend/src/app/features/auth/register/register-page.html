<section class="wrap py-16">
  <h1 class="display text-[clamp(36px,5vw,60px)]">Create account</h1>
  <p class="mt-4 text-muted">
    Already have an account? <a routerLink="/login" class="link">Log in</a>
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 flex max-w-md flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <label for="displayName" class="font-semibold">Name</label>
      <input
        id="displayName"
        formControlName="displayName"
        type="text"
        autocomplete="name"
        class="field-input"
        aria-describedby="displayName-hint displayName-error"
        [attr.aria-invalid]="errorFor('displayName') ? true : null"
      />
      <p id="displayName-hint" class="text-sm text-muted">Shown to others on Loc.</p>
      <p id="displayName-error" class="text-sm text-danger">
        @if (errorFor('displayName'); as message) {
          {{ message }}
        }
      </p>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="email" class="font-semibold">Email</label>
      <input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="email"
        class="field-input"
        aria-describedby="email-error"
        [attr.aria-invalid]="errorFor('email') ? true : null"
      />
      <p id="email-error" class="text-sm text-danger">
        @if (errorFor('email'); as message) {
          {{ message }}
        }
      </p>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="password" class="font-semibold">Password</label>
      <input
        id="password"
        formControlName="password"
        type="password"
        autocomplete="new-password"
        class="field-input"
        aria-describedby="password-hint password-error"
        [attr.aria-invalid]="errorFor('password') ? true : null"
      />
      <p id="password-hint" class="text-sm text-muted">At least 10 characters.</p>
      <p id="password-error" class="text-sm text-danger">
        @if (errorFor('password'); as message) {
          {{ message }}
        }
      </p>
    </div>

    <button type="submit" class="btn-primary">Create account</button>
  </form>
</section>
