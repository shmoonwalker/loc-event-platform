<header class="sticky top-0 z-10 border-b border-line bg-bg">
  <div class="wrap flex flex-wrap items-center gap-3 py-3">
    <a routerLink="/" class="flex items-center gap-2" aria-label="Loc home">
      <span
        class="grid size-8 place-items-center rounded-[50%_50%_50%_4px] bg-blush"
        aria-hidden="true"
      >
        <span class="size-2.5 rounded-full bg-panel"></span>
      </span>
      <span class="font-display text-[26px] font-extrabold tracking-[-0.03em]">loc</span>
    </a>

    <label class="pill-btn font-normal text-muted">
      <app-icon name="pin" />
      <span class="max-sm:sr-only">Your city</span>
      <select
        class="h-[34px] cursor-pointer bg-transparent pr-1.5 font-semibold text-ink"
        (change)="homeCity.set(citySelect.value)"
        #citySelect
      >
        @for (city of options(); track city.slug) {
          <option [value]="city.slug" [selected]="city.slug === homeCity.slug()">
            {{ city.name }}
          </option>
        }
      </select>
    </label>

    <button
      type="button"
      class="pill-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="
        theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
      <span class="max-sm:hidden">{{ theme.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
    </button>
    <nav aria-label="Account" class="ml-auto flex flex-wrap items-center gap-3">
      @if (session.currentUser(); as user) {
        <a routerLink="/saved" class="pill-btn min-h-11">Saved</a>
        <span class="min-w-0 text-sm">
          <span class="block max-w-40 truncate font-semibold" [title]="user.displayName">
            {{ user.displayName }}
          </span>
          <span class="text-xs text-muted">{{ session.isAdmin() ? 'Admin' : 'Member' }}</span>
        </span>
        <button type="button" class="btn-dark min-h-11" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/register" class="pill-btn min-h-11">Sign up</a>
        <a routerLink="/login" class="btn-dark min-h-11">Log in</a>
      }
    </nav>
  </div>
</header>
