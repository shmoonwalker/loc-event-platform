spring:
  application:
    name: loc-data
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:project_db}}?currentSchema=catalog
    username: ${DB_USER:${POSTGRES_USER:admin}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:password}}
  flyway:
    schemas: catalog
    default-schema: catalog
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: catalog
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A few workers taking one message each keeps outbound calls spread over time.
        concurrency: 2
        prefetch: 1
        # Rejected messages must reach the dead letter queue instead of returning to this one.
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 5s
          multiplier: 3
          max-interval: 1m
          max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

loc:
  publication:
    enabled: ${PUBLICATION_ENABLED:true}
    countries: ${PUBLICATION_COUNTRIES:NL}
    max-detail-age: ${PUBLICATION_MAX_DETAIL_AGE:PT72H}
    recheck-interval: PT5M
    scan-interval: PT1M
    include-season-passes: ${PUBLICATION_INCLUDE_SEASON_PASSES:false}
    # Only explicitly verified Ticketmaster virtual venue IDs. No keyword guessing.
    online-venue-ids: ${PUBLICATION_ONLINE_VENUE_IDS:}
  object-storage:
    # Enable once R2 credentials and the bucket are configured.
    enabled: ${R2_ENABLED:true}
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_ACCESS_KEY:}
    secret-access-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:}

  rvo:
    base-url: https://www.rvo.nl/api/v1/opendata/events

  ticketmaster:
    base-url: https://app.ticketmaster.com/discovery/v2/events.json
    country-code: NL
    locale: nl-nl
    page-size: 200
    api-key: ${Ticketmaster:}

  weather:
    # Disabling this keeps the application a one-pass importer with no scheduler and no queue.
    enabled: ${WEATHER_ENABLED:true}
    base-url: https://api.open-meteo.com/v1/forecast
    scan-interval: ${WEATHER_SCAN_INTERVAL:PT5M}
    # Leaves startup ingestion undisturbed before the first scan runs.
    scan-initial-delay: PT30S
    # Upper bound on messages queued per scan, so a backlog is worked through steadily.
    scan-limit: ${WEATHER_SCAN_LIMIT:200}
    # How long a queued slot is left alone before it counts as due again.
    claim-ttl: PT15M
    connect-timeout: PT5S
    read-timeout: PT10S

  tagging:
    enabled: ${TAGGING_ENABLED:true}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-key: ${GeminiAPIKey:}
    scan-interval: ${TAGGING_SCAN_INTERVAL:PT5M}
    scan-initial-delay: PT45S
    scan-limit: ${TAGGING_SCAN_LIMIT:15}
    daily-limit: ${TAGGING_DAILY_LIMIT:400}
    claim-ttl: PT15M
    connect-timeout: PT5S
    read-timeout: PT20S
