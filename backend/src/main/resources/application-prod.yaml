logging:
  level:
    root: INFO
  # trace and span ids put in the MDC by the OpenTelemetry agent, so a log line links to its trace
  pattern:
    correlation: "[%X{trace_id:-}-%X{span_id:-}] "

spring:
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
