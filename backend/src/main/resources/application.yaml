spring:
  application:
    name: loc-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:project_db}}
    username: ${DB_USER:${POSTGRES_USER:admin}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:password}}
  flyway:
    schemas: app
    default-schema: app
    table: flyway_backend_history
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

  mail:
    from: "${MAIL_FROM:Loc <no-reply@loc.local>}"
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  rate-limit:
    policies:
      register:
        capacity: 3
        period: 1m
      account-mail:
        capacity: 3
        period: 1h
      resend-verification:
        capacity: 3
        period: 1m
      # per IP + email
      login:
        capacity: 5
        period: 1m
      # per email across all IPs, against guessing spread over many addresses
      login-email:
        capacity: 20
        period: 1h

server:
  port: 8080
  # behind Cloudflare Tunnel and the frontend nginx: take the client IP from X-Forwarded-For, trusting only private proxies
  forward-headers-strategy: native

springdoc:
  api-docs:
    path: /api/docs/openapi.yaml
scalar:
  enabled: true
  path: /api/docs
  url: ${springdoc.api-docs.path}
