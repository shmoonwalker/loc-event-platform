# Production stack: frontend, backend and data only. PostgreSQL, RabbitMQ and Redis are shared
# infrastructure reached over an existing external network.
#
# Images are built by the Deploy workflow and tagged with the Git commit SHA. deploy/deploy.sh sets
# LOC_IMAGE_TAG and rolls the services out one by one; see deploy/README.md.
name: loc-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# OpenTelemetry Java agent settings shared by loc-backend and loc-data.
# Logs stay on the server's log forwarder, so the agent exports traces and metrics only.
x-otel: &otel
  OTEL_SDK_DISABLED: ${LOC_OTEL_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.eu01.nr-data.net
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HEADERS: api-key=${NEW_RELIC_LICENSE_KEY:?set NEW_RELIC_LICENSE_KEY (New Relic ingest license key)}
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
  OTEL_LOGS_EXPORTER: none
  # New Relic rejects attribute values longer than 4095 characters.
  OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: "4095"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,deployment.environment.name=production,service.version=${LOC_IMAGE_TAG}
  # Ticketmaster takes its API key as ?apikey=; the rest are the agent's defaults, which this list replaces.
  OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS: apikey,AWSAccessKeyId,Signature,X-Amz-Signature,X-Amz-Credential,X-Amz-Security-Token,sig,X-Goog-Signature

services:
  # Service names are prefixed: Compose registers every service name as a DNS alias on each network
  # it joins, and a bare "backend" on the shared network could answer for another application.
  loc-frontend:
    image: ghcr.io/shmoonwalker/loc-frontend:${LOC_IMAGE_TAG:?set LOC_IMAGE_TAG to a release commit SHA}
    container_name: loc-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      BACKEND_URL: http://backend:8080
    networks:
      - app
    mem_limit: ${LOC_FRONTEND_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  loc-backend:
    image: ghcr.io/shmoonwalker/loc-backend:${LOC_IMAGE_TAG:?set LOC_IMAGE_TAG to a release commit SHA}
    container_name: loc-backend
    restart: unless-stopped
    # No host port: only loc-frontend reaches it, as http://backend:8080 on the app network.
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: loc-backend
      # Redis span statements contain the rate-limit keys, which hold client IPs and email addresses.
      OTEL_INSTRUMENTATION_LETTUCE_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER}
      DB_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL (redis://:password@host:6379)}
      # Spring binds these names to spring.mail.* and app.mail.* directly.
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD (Resend API key)}
      APP_MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      APP_MAIL_FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      APP_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 32)}
      # The agent's classes and metaspace live outside the heap, so the heap gets 65% of the limit.
      JAVA_TOOL_OPTIONS: -javaagent:/opt/opentelemetry-javaagent.jar ${LOC_BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=65}
    networks:
      app:
        aliases: [backend]
      shared: {}
    mem_limit: ${LOC_BACKEND_MEM_LIMIT:-768m}
    # Spring Boot shuts down gracefully within 30s per phase; Docker's default 10s would cut it short.
    stop_grace_period: 40s
    healthcheck:
      # The image has no curl or wget: a plain HTTP/1.0 request through bash, healthy on 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logging

  loc-data:
    image: ghcr.io/shmoonwalker/loc-data:${LOC_IMAGE_TAG:?set LOC_IMAGE_TAG to a release commit SHA}
    container_name: loc-data
    restart: unless-stopped
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: loc-data
      # The pipeline runs hundreds of thousands of SQL statements per collection run; a span for each
      # would use up the New Relic free ingest allowance. Connection pool metrics stay on.
      OTEL_INSTRUMENTATION_JDBC_ENABLED: "false"
      OTEL_INSTRUMENTATION_HIBERNATE_ENABLED: "false"
      OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DATA_DB_USER:?set DATA_DB_USER}
      DB_PASSWORD: ${DATA_DB_PASSWORD:?set DATA_DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:?set RABBITMQ_VHOST}
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?set R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?set R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
      Ticketmaster: ${Ticketmaster:?set Ticketmaster (API key)}
      GeminiAPIKey: ${GeminiAPIKey:?set GeminiAPIKey}
      JAVA_TOOL_OPTIONS: -javaagent:/opt/opentelemetry-javaagent.jar ${LOC_DATA_JAVA_OPTS:--XX:MaxRAMPercentage=65}
    networks:
      - shared
    mem_limit: ${LOC_DATA_MEM_LIMIT:-768m}
    stop_grace_period: 40s
    logging: *logging

networks:
  app: {}
  shared:
    external: true
    name: ${LOC_SHARED_NETWORK:?set LOC_SHARED_NETWORK to the existing infrastructure network}
